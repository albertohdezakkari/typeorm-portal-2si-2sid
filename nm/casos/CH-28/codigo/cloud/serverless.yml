service: taller-ch28
frameworkVersion: '3.40.0'

provider:
  name: aws
  runtime: nodejs22.x
  region: ${env:AWS_REGION}
  stage: ${env:TALLER_EQUIPO}
  iam:
    role: ${env:LAMBDA_ROLE_ARN}
  httpApi:
    payload: '2.0'
    cors: true

  environment:
    TABLA_VIVEROS: { Ref: TablaViveros }
    TABLA_PLANTAS: { Ref: TablaPlantas }
    TABLA_JARDINEROS: { Ref: TablaJardineros }
    TABLA_ASIGNACIONES: { Ref: TablaAsignaciones }


functions:
  salud:
    handler: src/salud/handler.handler
    events:
      - httpApi: { method: GET, path: /salud }
  crearPlanta:
    handler: src/plantas/crear-listar/handler.crearHandler
    events:
      - httpApi: { method: POST, path: '/plantas' }
  listarPlantas:
    handler: src/plantas/crear-listar/handler.listarHandler
    events:
      - httpApi: { method: GET, path: '/plantas' }
  eliminarPlanta:
    handler: src/plantas/eliminar/handler.handler
    events:
      - httpApi: { method: DELETE, path: '/plantas/{plantaId}' }
  modificarAlturaCm:
    handler: src/plantas/modificar-altura-cm/handler.handler
    events:
      - httpApi: { method: PATCH, path: '/plantas/{plantaId}' }
  trasladarPlanta:
    handler: src/plantas/trasladar/handler.handler
    events:
      - httpApi: { method: PATCH, path: '/plantas/{plantaId}/vivero' }
  consultarVivero:
    handler: src/viveros/consultar/handler.handler
    events:
      - httpApi: { method: GET, path: '/viveros/{viveroId}/plantas' }
  crearJardinero:
    handler: src/jardineros/crear-listar/handler.crearHandler
    events:
      - httpApi: { method: POST, path: '/jardineros' }
  listarJardineros:
    handler: src/jardineros/crear-listar/handler.listarHandler
    events:
      - httpApi: { method: GET, path: '/jardineros' }
  asignarJardinero:
    handler: src/asignaciones/asignar-jardinero/handler.handler
    events:
      - httpApi: { method: POST, path: '/plantas/{plantaId}/asignaciones' }
  listarAsignacionesPorPlanta:
    handler: src/asignaciones/listar-por-planta/handler.handler
    events:
      - httpApi: { method: GET, path: '/plantas/{plantaId}/asignaciones' }
  listarAsignacionesPorJardinero:
    handler: src/asignaciones/listar-por-jardinero/handler.handler
    events:
      - httpApi: { method: GET, path: '/jardineros/{jardineroId}/asignaciones' }
  modificarRol:
    handler: src/asignaciones/modificar-rol/handler.handler
    events:
      - httpApi: { method: PATCH, path: '/plantas/{plantaId}/asignaciones/{jardineroId}' }
  eliminarAsignacion:
    handler: src/asignaciones/eliminar-asignacion/handler.handler
    events:
      - httpApi: { method: DELETE, path: '/plantas/{plantaId}/asignaciones/{jardineroId}' }

resources:
  Resources:
    TablaViveros:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: VIVEROS_${env:TALLER_EQUIPO}
        # PARTITION KEY: VIVERO_ID (N: número).
        # CAMPOS NO CLAVE de esta tabla (fuera de su PK):
        #   NOMBRE (S: texto).
        # Sus tipos se describen en MODELO_VIVERO.
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: VIVERO_ID, AttributeType: N }
        KeySchema:
          - AttributeName: VIVERO_ID
            KeyType: HASH  # Partition key del lado 1.

    TablaPlantas:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: PLANTAS_${env:TALLER_EQUIPO}
        # PARTITION KEY: PLANTA_ID (N: número).
        # CAMPOS NO CLAVE de esta tabla (fuera de su PK):
        #   NOMBRE (S: texto).
        #   ALTURA_CM (N: número).
        #   VIVERO_ID (N: referencia y clave del GSI).
        # Sus tipos se describen en MODELO_PLANTA.
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:  # N = número. Declara las claves.
          - { AttributeName: PLANTA_ID, AttributeType: N }
          - { AttributeName: VIVERO_ID, AttributeType: N }
        KeySchema:
          - AttributeName: PLANTA_ID
            KeyType: HASH  # Partition key del lado N.

        # GSI: segunda forma de buscar en PLANTAS.
        # Global: agrupa todo el lado N por su referencia.
        GlobalSecondaryIndexes:
          - IndexName: PorVivero
            # Clave compuesta = partition key + sort key:
            # (VIVERO_ID, PLANTA_ID), los dos valores juntos.
            KeySchema:
              - AttributeName: VIVERO_ID
                KeyType: HASH   # Partition key. Agrupa por Vivero.
              - AttributeName: PLANTA_ID
                KeyType: RANGE  # Sort key. Ordena por ID.
            Projection:
              ProjectionType: INCLUDE  # Claves + campos de abajo.
              NonKeyAttributes:        # Campos de PLANTAS copiados al índice.
                - NOMBRE
                - ALTURA_CM

    TablaJardineros:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: JARDINEROS_${env:TALLER_EQUIPO}
        # PK: JARDINERO_ID. Datos: NOMBRE, APELLIDOS, EMAIL (en Entity).
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: JARDINERO_ID, AttributeType: N }
        KeySchema:
          - AttributeName: JARDINERO_ID
            KeyType: HASH  # Partition key: identifica al jardinero.

    TablaAsignaciones:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ASIGNACIONES_${env:TALLER_EQUIPO}
        # PK compuesta: PLANTA_ID + JARDINERO_ID. Dato no clave: ROL.
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: PLANTA_ID, AttributeType: N }
          - { AttributeName: JARDINERO_ID, AttributeType: N }
        KeySchema:
          - AttributeName: PLANTA_ID
            KeyType: HASH  # Partition key: agrupa las asignaciones de una planta.
          - AttributeName: JARDINERO_ID
            KeyType: RANGE # Sort key: distingue al jardinero dentro de la planta.
        GlobalSecondaryIndexes:
          - IndexName: PorJardinero
            KeySchema:
              - AttributeName: JARDINERO_ID
                KeyType: HASH  # Agrupa las asignaciones del jardinero.
              - AttributeName: PLANTA_ID
                KeyType: RANGE # Ordena sus plantas por ID.
            Projection:
              ProjectionType: INCLUDE
              NonKeyAttributes:
                - ROL # Copia ROL al índice; ambas claves ya se incluyen.

  Outputs:
    JardinerosTableName:
      Value: { Ref: TablaJardineros }
    AsignacionesTableName:
      Value: { Ref: TablaAsignaciones }
