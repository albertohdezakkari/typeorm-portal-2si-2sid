service: taller-ch03
frameworkVersion: '3.40.0'

provider:
  name: aws
  runtime: nodejs22.x
  region: ${env:AWS_REGION}
  stage: ${env:TALLER_EQUIPO}
  iam:
    role: ${env:LAMBDA_ROLE_ARN}
  httpApi:
    payload: '2.0'
    cors: true

  environment:
    TABLA_MUSEOS: { Ref: TablaMuseos }
    TABLA_PIEZAS: { Ref: TablaPiezas }
    TABLA_RESTAURADORES: { Ref: TablaRestauradores }
    TABLA_ASIGNACIONES: { Ref: TablaAsignaciones }


functions:
  crearMuseo:
    handler: src/museos/crear-listar/handler.crearHandler
    events:
      - httpApi: { method: POST, path: /museos }
  listarMuseos:
    handler: src/museos/crear-listar/handler.listarHandler
    events:
      - httpApi: { method: GET, path: /museos }
  salud:
    handler: src/salud/handler.handler
    events:
      - httpApi: { method: GET, path: /salud }
  crearPieza:
    handler: src/piezas/crear-listar/handler.crearHandler
    events:
      - httpApi: { method: POST, path: '/piezas' }
  listarPiezas:
    handler: src/piezas/crear-listar/handler.listarHandler
    events:
      - httpApi: { method: GET, path: '/piezas' }
  eliminarPieza:
    handler: src/piezas/eliminar/handler.handler
    events:
      - httpApi: { method: DELETE, path: '/piezas/{piezaId}' }
  modificarAntiguedadAnios:
    handler: src/piezas/modificar-antiguedad-anios/handler.handler
    events:
      - httpApi: { method: PATCH, path: '/piezas/{piezaId}' }
  trasladarPieza:
    handler: src/piezas/trasladar/handler.handler
    events:
      - httpApi: { method: PATCH, path: '/piezas/{piezaId}/museo' }
  consultarMuseo:
    handler: src/museos/consultar/handler.handler
    events:
      - httpApi: { method: GET, path: '/museos/{museoId}/piezas' }
  crearRestaurador:
    handler: src/restauradores/crear-listar/handler.crearHandler
    events:
      - httpApi: { method: POST, path: '/restauradores' }
  listarRestauradores:
    handler: src/restauradores/crear-listar/handler.listarHandler
    events:
      - httpApi: { method: GET, path: '/restauradores' }
  asignarRestaurador:
    handler: src/asignaciones/asignar-restaurador/handler.handler
    events:
      - httpApi: { method: POST, path: '/piezas/{piezaId}/asignaciones' }
  listarAsignacionesPorPieza:
    handler: src/asignaciones/listar-por-pieza/handler.handler
    events:
      - httpApi: { method: GET, path: '/piezas/{piezaId}/asignaciones' }
  listarAsignacionesPorRestaurador:
    handler: src/asignaciones/listar-por-restaurador/handler.handler
    events:
      - httpApi: { method: GET, path: '/restauradores/{restauradorId}/asignaciones' }
  modificarRol:
    handler: src/asignaciones/modificar-rol/handler.handler
    events:
      - httpApi: { method: PATCH, path: '/piezas/{piezaId}/asignaciones/{restauradorId}' }
  eliminarAsignacion:
    handler: src/asignaciones/eliminar-asignacion/handler.handler
    events:
      - httpApi: { method: DELETE, path: '/piezas/{piezaId}/asignaciones/{restauradorId}' }

resources:
  Resources:
    TablaMuseos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: MUSEOS_${env:TALLER_EQUIPO}
        # PARTITION KEY: MUSEO_ID (N: número).
        # CAMPOS NO CLAVE de esta tabla (fuera de su PK):
        #   NOMBRE (S: texto).
        # Sus tipos se describen en MODELO_MUSEO.
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: MUSEO_ID, AttributeType: N }
        KeySchema:
          - AttributeName: MUSEO_ID
            KeyType: HASH  # Partition key del lado 1.

    TablaPiezas:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: PIEZAS_${env:TALLER_EQUIPO}
        # PARTITION KEY: PIEZA_ID (N: número).
        # CAMPOS NO CLAVE de esta tabla (fuera de su PK):
        #   NOMBRE (S: texto).
        #   ANTIGUEDAD_ANIOS (N: número).
        #   MUSEO_ID (N: referencia y clave del GSI).
        # Sus tipos se describen en MODELO_PIEZA.
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:  # N = número. Declara las claves.
          - { AttributeName: PIEZA_ID, AttributeType: N }
          - { AttributeName: MUSEO_ID, AttributeType: N }
        KeySchema:
          - AttributeName: PIEZA_ID
            KeyType: HASH  # Partition key del lado N.

        # GSI: segunda forma de buscar en PIEZAS.
        # Global: agrupa todo el lado N por su referencia.
        GlobalSecondaryIndexes:
          - IndexName: PorMuseo
            # Clave compuesta = partition key + sort key:
            # (MUSEO_ID, PIEZA_ID), los dos valores juntos.
            KeySchema:
              - AttributeName: MUSEO_ID
                KeyType: HASH   # Partition key. Agrupa por Museo.
              - AttributeName: PIEZA_ID
                KeyType: RANGE  # Sort key. Ordena por ID.
            Projection:
              ProjectionType: INCLUDE  # Claves + campos de abajo.
              NonKeyAttributes:        # Campos de PIEZAS copiados al índice.
                - NOMBRE
                - ANTIGUEDAD_ANIOS

    TablaRestauradores:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: RESTAURADORES_${env:TALLER_EQUIPO}
        # PK: RESTAURADOR_ID. Datos: NOMBRE, APELLIDOS, EMAIL (en Entity).
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: RESTAURADOR_ID, AttributeType: N }
        KeySchema:
          - AttributeName: RESTAURADOR_ID
            KeyType: HASH  # Partition key: identifica al restaurador.

    TablaAsignaciones:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ASIGNACIONES_${env:TALLER_EQUIPO}
        # PK compuesta: PIEZA_ID + RESTAURADOR_ID. Dato no clave: ROL.
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: PIEZA_ID, AttributeType: N }
          - { AttributeName: RESTAURADOR_ID, AttributeType: N }
        KeySchema:
          - AttributeName: PIEZA_ID
            KeyType: HASH  # Partition key: agrupa las asignaciones de una pieza.
          - AttributeName: RESTAURADOR_ID
            KeyType: RANGE # Sort key: distingue al restaurador dentro de la pieza.
        GlobalSecondaryIndexes:
          - IndexName: PorRestaurador
            KeySchema:
              - AttributeName: RESTAURADOR_ID
                KeyType: HASH  # Agrupa las asignaciones del restaurador.
              - AttributeName: PIEZA_ID
                KeyType: RANGE # Ordena sus piezas por ID.
            Projection:
              ProjectionType: INCLUDE
              NonKeyAttributes:
                - ROL # Copia ROL al índice; ambas claves ya se incluyen.

  Outputs:
    RestauradoresTableName:
      Value: { Ref: TablaRestauradores }
    AsignacionesTableName:
      Value: { Ref: TablaAsignaciones }
